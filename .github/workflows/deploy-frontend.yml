name: Deploy Frontend (Vercel)

# Preview deployment on every PR, production deployment on push to main.
# Skips cleanly (no-op, not a failure) when Vercel secrets aren't configured
# yet — see docs/deployment.md for the one-time `vercel link` + secrets setup.
#
# Alternative: Vercel's own GitHub integration (connect the repo at
# vercel.com/new) does this without any workflow at all and is what most
# hackathon teams should actually use — this workflow exists for teams that
# want deploys gated behind the same CI checks as everything else, or that
# need more control than the integration gives them. Don't run both: pick one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # to comment the preview URL on the PR

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check Vercel secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set — skipping deploy. See docs/deployment.md." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to Vercel
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Run Vercel CLI from the repo root (not cd'd into packages/nextjs) and
      # point it at the app directory explicitly. next.config.ts sets
      # turbopack.root to the monorepo root so Next.js resolves the workspace
      # correctly; running the CLI from that same root keeps its own path
      # resolution consistent with Next's, which cd-ing into the subfolder
      # does not (it previously caused "File does not exist: .next/package.json"
      # during `vercel deploy --prebuilt`).
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token="$VERCEL_TOKEN" packages/nextjs

      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: vercel build --prod --token="$VERCEL_TOKEN" packages/nextjs

      - name: Build (preview)
        if: github.ref != 'refs/heads/main'
        run: vercel build --token="$VERCEL_TOKEN" packages/nextjs

      - name: Deploy (production)
        if: github.ref == 'refs/heads/main'
        id: deploy-prod
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" packages/nextjs)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy (preview)
        if: github.ref != 'refs/heads/main'
        id: deploy-preview
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" packages/nextjs)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy-preview.outputs.url }}";
            if (!url) return;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔗 Preview deployed: ${url}`,
            });
