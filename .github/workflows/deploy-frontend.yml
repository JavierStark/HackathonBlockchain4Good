name: Deploy Frontend (Vercel)

# Preview deployment on every PR, production deployment on push to main.
# Skips cleanly (no-op, not a failure) when Vercel secrets aren't configured
# yet — see docs/deployment.md for the one-time `vercel link` + secrets setup.
#
# Alternative: Vercel's own GitHub integration (connect the repo at
# vercel.com/new) does this without any workflow at all and is what most
# hackathon teams should actually use — this workflow exists for teams that
# want deploys gated behind the same CI checks as everything else, or that
# need more control than the integration gives them. Don't run both: pick one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # to comment the preview URL on the PR

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets:
    name: Check Vercel secrets are configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set — skipping deploy. See docs/deployment.md." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to Vercel
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        working-directory: packages/nextjs
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      # TEMP DIAGNOSTIC — remove once the deploy step's "File does not exist"
      # error is root-caused. project.json/settings only contain org/project
      # ids, not the token, so this is safe to print.
      - name: Debug — show pulled project settings
        working-directory: packages/nextjs
        run: |
          echo "--- .vercel/project.json ---"
          cat .vercel/project.json || true
          echo "--- .vercel/output/config.json (after build, if present) ---"
          find .vercel -type f -name "*.json" || true

      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        working-directory: packages/nextjs
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Build (preview)
        if: github.ref != 'refs/heads/main'
        working-directory: packages/nextjs
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Debug — show build output structure
        working-directory: packages/nextjs
        run: |
          echo "--- .vercel/output/config.json ---"
          cat .vercel/output/config.json || true
          echo "--- .next dir contents (top level) ---"
          ls -la .next || true

      - name: Deploy (production)
        if: github.ref == 'refs/heads/main'
        id: deploy-prod
        working-directory: packages/nextjs
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy (preview)
        if: github.ref != 'refs/heads/main'
        id: deploy-preview
        working-directory: packages/nextjs
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy-preview.outputs.url }}";
            if (!url) return;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔗 Preview deployed: ${url}`,
            });
